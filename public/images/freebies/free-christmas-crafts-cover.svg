<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Free Christmas Crafts Starter Pack cover: a Christmas tree, snowman and gift box">
